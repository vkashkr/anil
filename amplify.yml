version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@latest --activate
        - pnpm config set ignore-scripts false
        - pnpm fetch --reporter=append-only
        - pnpm approve-builds --all || true
        - pnpm install --shamefully-hoist --no-frozen-lockfile --reporter=append-only --ignore-scripts=false
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .pnpm-store/**/*
  env:
    variables:
      NODE_ENV: production
