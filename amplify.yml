version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@9.15.9 --activate
        - pnpm install --frozen-lockfile --prod=false --shamefully-hoist --reporter=append-only --ignore-scripts=false
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .pnpm-store/**/*
  env:
    variables:
      NODE_ENV: production
