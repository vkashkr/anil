version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - npm config set unsafe-perm true
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .pnpm-store/**/*
  env:
    variables:
      NODE_ENV: production
