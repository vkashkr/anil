<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="heatGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3e2723" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1a120b" stop-opacity="1" />
    </radialGradient>
    <filter id="blurFilter">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
  </defs>

  <!-- Background: Sweltering dark room -->
  <rect width="800" height="500" fill="#1a120b" />
  <rect width="800" height="500" fill="url(#heatGlow)" opacity="0.6" />

  <!-- Single window light casting a geometric shadow -->
  <path d="M600 0 L800 500 L800 0 Z" fill="#000" opacity="0.4" />
  
  <!-- Abstract Window/Fan suggestion -->
  <rect x="650" y="50" width="100" height="150" fill="#1f2937" opacity="0.3" filter="url(#blurFilter)" />

  <!-- Girl Face / Silhouette -->
  <!-- Stylized to look like a woman lying down or deep in thought/heat -->
  <g transform="translate(400, 250) scale(1.5)">
    <!-- Hair Background -->
    <path d="M-60,-50 Q-90,0 -70,60 Q-40,90 0,90 Q40,90 70,60 Q90,0 60,-50 Q0,-80 -60,-50" fill="#0d0d0d" />
    
    <!-- Face Contour -->
    <path d="M-40,-30 C-50,20 -35,60 0,70 C35,60 50,20 40,-30 C30,-60 -30,-60 -40,-30" fill="#8d6e63" opacity="0.95" />
    
    <!-- Neck / Shoulders hinting at lying down -->
    <path d="M-30,65 Q-50,90 -70,110 L70,110 Q50,90 30,65 Z" fill="#5d4037" />

    <!-- Features: Eyes Closed -->
    <path d="M-22,-5 Q-15,3 -8,-5" stroke="#2e1b16" stroke-width="1.8" fill="none" opacity="0.9" />
    <path d="M8,-5 Q15,3 22,-5" stroke="#2e1b16" stroke-width="1.8" fill="none" opacity="0.9" />

    <!-- Nose Bridge Shadow -->
    <path d="M-2,-5 Q-4,10 -1,18" stroke="#3e2723" stroke-width="1" fill="none" opacity="0.5" />
    
    <!-- Lips -->
    <path d="M-10,32 Q0,38 10,32" stroke="#4e342e" stroke-width="2.5" fill="none" opacity="0.8" />
    
    <!-- Sweat detail / heat shimmer -->
    <circle cx="-15" cy="-20" r="1.5" fill="#fff" opacity="0.15" />
    <circle cx="25" cy="10" r="1.5" fill="#fff" opacity="0.15" />
  </g>

  <!-- Post-processing tint for "summer heat" -->
  <rect width="800" height="500" fill="#ffb74d" mix-blend-mode="overlay" opacity="0.1" />
</svg>